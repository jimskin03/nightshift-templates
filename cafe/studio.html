<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Local-only Cafe template editor preview for Nightshift."><title>Cafe template studio · Nightshift</title><link rel="stylesheet" href="studio.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">Nightshift <small>Cafe template studio</small></div><nav class="side-nav" aria-label="Studio"><a aria-current="true" href="#dashboard">Dashboard</a><a href="#gallery">Gallery</a><a href="#editor">Editor</a></nav></aside><main class="main" id="dashboard"><header class="topbar"><div><div class="kicker">Vertical slice · local preview</div><h1>Kopi Lane</h1></div><div class="actions"><button class="button" id="save" type="button">Save draft</button><button class="button primary" id="publish" type="button">Publish</button></div></header><div class="notice" role="status" id="notice">Backend configuration pending. Changes stay in this browser and are not written to Supabase.</div><div class="workspace"><section class="panel" id="editor" aria-labelledby="editor-title"><h2 id="editor-title">Edit your cafe</h2><form id="editor-form"><div class="field"><label for="brandName">Cafe name</label><input class="input" id="brandName" name="brandName" required maxlength="60"></div><div class="field"><label for="tagline">Hero tagline</label><textarea class="input" id="tagline" name="tagline" required maxlength="160" rows="3"></textarea></div><div class="field"><label for="hours">Opening hours</label><input class="input" id="hours" name="hours" required maxlength="80"></div><div class="field"><label for="address">Address</label><input class="input" id="address" name="address" required maxlength="120"></div><div class="field"><label for="accent">Accent colour</label><input class="input" id="accent" name="accent" type="color"></div><fieldset><legend>Menu highlights</legend><div id="menu-fields"></div></fieldset><p class="error" id="errors" aria-live="polite"></p></form></section><section class="panel" id="gallery" aria-labelledby="preview-title"><h2 id="preview-title">Gallery preview</h2><div class="preview-wrap"><iframe id="preview" title="Isolated live cafe preview" src="preview.html" sandbox="allow-scripts allow-same-origin"></iframe></div><p class="status" id="preview-status">Connecting to isolated preview…</p></section></div></main></div><script src="studio.js"></script></body></html>
